name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://agentscope:agentscope@localhost:5432/agentscope
      TEST_DATABASE_URL: postgresql://agentscope:agentscope@localhost:5432/agentscope
      E2E_SANDBOX: "1"
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agentscope
          POSTGRES_USER: agentscope
          POSTGRES_PASSWORD: agentscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentscope -d agentscope"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Deterministic eval
        run: npm run eval

      - name: Migrate PostgreSQL
        run: npm run db:migrate

      - name: PostgreSQL integration
        run: npm run test:postgres

      - name: Docker sandbox
        run: npm test -- tests/agentscope-workspace-sandbox.test.ts
        env:
          TEST_DOCKER_SANDBOX: "1"

      - name: Build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chrome

      - name: Browser E2E
        run: npm run e2e

      - name: Production dependency audit
        run: npm audit --omit=dev
