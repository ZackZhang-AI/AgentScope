services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agentscope
      POSTGRES_USER: agentscope
      POSTGRES_PASSWORD: agentscope
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentscope -d agentscope"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
