name: Bug 反馈
description: 报告可复现的功能异常
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际行为和预期行为。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选择...
        2. 输入...
        3. 点击...
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Mock
        - DeepSeek
        - MiniMax
        - 与 Provider 无关
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统、浏览器、Node.js 版本等。
